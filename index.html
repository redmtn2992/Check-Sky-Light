  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>
    <script>
      // Automatically refresh Service Worker and purge stale build caches on iPhone / Safari
      const APP_BUILD_KEY = 'csl_build_v2.0_prod';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (let r of regs) {
            r.update();
          }
        });
      }
      if ('caches' in window) {
        const stored = localStorage.getItem('csl_build_version');
        if (stored !== APP_BUILD_KEY) {
          caches.keys().then(function(keys) {
            for (let k of keys) {
              if (k !== 'leaflet-assets-cache') {
                caches.delete(k);
              }
            }
          });
          localStorage.setItem('csl_build_version', APP_BUILD_KEY);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
