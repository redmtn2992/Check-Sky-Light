    <script>
      try {
        const APP_BUILD_KEY = 'csl_build_v3.7_prod';
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let r of regs) {
              r.update();
            }
          }).catch(function() {});
        }
        if ('caches' in window && 'localStorage' in window) {
          const stored = localStorage.getItem('csl_build_version');
          if (stored !== APP_BUILD_KEY) {
            caches.keys().then(function(keys) {
              for (let k of keys) {
                if (k !== 'leaflet-assets-cache') {
                  caches.delete(k);
                }
              }
            }).catch(function() {});
            localStorage.setItem('csl_build_version', APP_BUILD_KEY);
          }
        }
